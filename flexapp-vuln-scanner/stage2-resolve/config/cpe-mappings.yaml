# Manual vendor/product -> CPE overrides, per PLAN.md: "Build a small,
# editable cpe-mappings.yaml for manual vendor/product overrides rather than
# trying to be clever." CPE resolution from PE metadata (and from
# string-signature banner names) is lossy - this table exists so real,
# known mappings can be curated by hand instead of guessed.
#
# Each entry's `match` is checked against a Stage 1 identity object:
#   method  - OPTIONAL; one of pe-version-resource, dotnet-manifest,
#             string-signature, electron-embedded. Omit unless the entry
#             genuinely needs to be scoped to one method - found live that
#             requiring an exact method match caused a real "zlib" Win32
#             version resource (method pe-version-resource) to miss a
#             mapping written only for the string-signature path, even
#             though "zlib" unambiguously means the same thing either way.
#   vendor  - optional, case-insensitive exact match against identity.vendor
#   product - optional, case-insensitive exact match against identity.product
# `cpe` gives the NVD CPE 2.3 vendor/product to use instead of guessing.
# First matching entry wins. Anything with no match here falls back to an
# automatic heuristic normalization - tagged confidence "heuristic", never
# "mapped-cpe", so a report never overstates how sure this mapping is.
#
# Deliberately NOT included here: OBS Studio, x264, CEF, ANGLE. Checked
# each against the real NVD CPE dictionary (2026-08-13, via web search
# since services.nvd.nist.gov and nvd.nist.gov are both blocked from
# direct fetch in this dev environment) and found no dedicated CPE entry
# for any of them - OBS Studio's own product has none at all (a search
# for "OBS Studio" only turned up an unrelated "obs-server" product);
# ANGLE's and CEF's bugs surface as Chromium CVEs instead of their own.
# Adding a guessed canonical vendor string without a real dictionary entry
# to verify against would be presenting a guess as "mapped-cpe"
# confidence - no more trustworthy than "heuristic", just labeled as if
# it were, and here there's nothing to match against regardless.
#
# FFmpeg/Qt/Chromium below ARE confirmed real NVD dictionary entries
# (checked the same way) - previously left out for the same "unverified"
# reason, added once verified.

mappings:
  - match:
      product: OpenSSL
    cpe:
      vendor: openssl
      product: openssl

  - match:
      product: zlib
    cpe:
      vendor: zlib
      product: zlib

  - match:
      product: libcurl
    cpe:
      vendor: haxx
      product: curl

  # "The curl library" is curl.dll's actual Win32 ProductName (confirmed
  # live) - same project, different label than the string-signature path's
  # "libcurl", so it needs its own entry rather than relying on the one above.
  - match:
      product: The curl library
    cpe:
      vendor: haxx
      product: curl

  - match:
      product: SQLite
    cpe:
      vendor: sqlite
      product: sqlite

  # Confirmed real NVD dictionary entry: cpe:2.3:a:ffmpeg:ffmpeg:<version>
  # (428 records). Detected FFmpeg identities carry FFmpeg's own git-tag
  # version convention ("n7.1.1", leading "n") - NVD's dictionary uses
  # plain "7.1.1" - so a vendor/product fix alone wouldn't match anything;
  # versionPattern strips the "n" and anything past the X.Y.Z triple.
  - match:
      product: FFmpeg
    cpe:
      vendor: ffmpeg
      product: ffmpeg
      versionPattern: '^n?(\d+\.\d+\.\d+)'
      versionGroup: 1

  # Confirmed real NVD dictionary entry: cpe:2.3:a:qt:qt:<version> (397
  # records) - the dictionary's product is "qt", not "qt6"; Qt5 and Qt6
  # share the same NVD product name. Detected "Qt6" identities carry a
  # Win32 FILEVERSION resource's 4-part version ("6.8.3.0") where NVD's
  # dictionary is 3-part ("6.8.3"); versionPattern drops the trailing
  # 4th segment.
  - match:
      product: Qt6
    cpe:
      vendor: qt
      product: qt
      versionPattern: '^(\d+\.\d+\.\d+)(?:\.\d+)?$'
      versionGroup: 1

  # Confirmed real NVD dictionary entry: cpe:2.3:a:chromium:chromium:<version>
  # - a real, dedicated Chromium product distinct from Google Chrome.
  # Detected 4-part versions (e.g. "127.0.6533.120") already match a real
  # dictionary example found ("11.0.696.64"), no version transform needed.
  - match:
      product: Chromium
    cpe:
      vendor: chromium
      product: chromium

  # Chromium-in-Electron: Electron bundles Chromium, not Google Chrome
  # itself, so the dedicated Chromium CPE above is more accurate than the
  # google:chrome approximation this used before that entry was confirmed
  # against the real NVD dictionary.
  - match:
      method: electron-embedded
      product: Electron Chromium
    cpe:
      vendor: chromium
      product: chromium

  - match:
      method: electron-embedded
      product: Electron Node.js
    cpe:
      vendor: nodejs
      product: node.js
