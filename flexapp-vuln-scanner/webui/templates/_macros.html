{% macro affected_files_cell(r) %}
  {% if r.relativePaths|length == 0 %}
    <span class="hint">—</span>
  {% elif r.relativePaths|length == 1 %}
    <code class="file-path">{{ r.relativePaths[0] }}</code>
  {% else %}
    <details class="affected-files">
      <summary>{{ r.relativePaths|length }} files</summary>
      <ul>
        {% for path in r.relativePaths %}
        <li><code class="file-path">{{ path }}</code></li>
        {% endfor %}
      </ul>
    </details>
  {% endif %}
{% endmacro %}
