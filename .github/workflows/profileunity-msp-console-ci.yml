name: ProfileUnity MSP Console CI

on:
  push:
    branches: ["**"]
    paths:
      - "ProfileUnityMSPConsole/**"
      - ".github/workflows/profileunity-msp-console-ci.yml"
  pull_request:
    paths:
      - "ProfileUnityMSPConsole/**"
      - ".github/workflows/profileunity-msp-console-ci.yml"

defaults:
  run:
    working-directory: ProfileUnityMSPConsole

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Sync version
        run: ./scripts/sync-version.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # The full release pipeline (SBOM regeneration, Grype CVE gate, notices,
  # frontend build, version sync, packaging) is added as its own job once
  # those pieces exist — see scripts/release.sh and project brief §11.8 for
  # the required ordering. This job is intentionally not implemented yet.
