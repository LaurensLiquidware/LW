<div class="mx-auto flex max-w-xl flex-col gap-4 p-6">
  <h1 class="lwl-card-title" style="font-size: var(--text-xl);">{{ 'newScan.heading' | transloco }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    @if (error()) {
      <p-message severity="error" styleClass="w-full">{{ errorIsRaw() ? error()! : (error()! | transloco) }}</p-message>
    }

    <div class="flex flex-col gap-1">
      <label for="packagePath" class="lwl-micro">{{ 'newScan.packagePath' | transloco }}</label>
      <input
        pInputText
        id="packagePath"
        formControlName="packagePath"
        (blur)="onPackagePathChange()"
        [placeholder]="'newScan.packagePathPlaceholder' | transloco"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="outputDir" class="lwl-micro">{{ 'newScan.outputDir' | transloco }}</label>
      <input pInputText id="outputDir" formControlName="outputDir" />
    </div>

    <p-panel [header]="'newScan.advanced' | transloco" [toggleable]="true" [collapsed]="true">
      <div class="flex flex-col gap-1">
        <label for="nvdApiKey" class="lwl-micro">{{ 'newScan.nvdApiKey' | transloco }}</label>
        <input pInputText id="nvdApiKey" formControlName="nvdApiKey" type="password" />
        <p class="lwl-micro">{{ 'newScan.nvdApiKeyHint' | transloco }}</p>
      </div>
    </p-panel>

    <div class="flex justify-end gap-2">
      <p-button
        type="submit"
        [label]="'newScan.start' | transloco"
        icon="pi pi-search"
        [loading]="submitting()"
        [disabled]="form.invalid"
      />
    </div>
  </form>
</div>
