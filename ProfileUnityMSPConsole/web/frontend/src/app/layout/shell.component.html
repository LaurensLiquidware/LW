<div class="flex h-screen flex-col">
  <header
    class="flex items-center justify-between px-4"
    style="height: var(--header-height); background: var(--header-bg); color: var(--p-surface-0);"
  >
    <div class="flex items-center gap-3">
      <img src="assets/images/logo-primary-light.svg" alt="Liquidware" class="h-8" />
      <span style="font-size: var(--header-font-size); font-weight: var(--weight-medium);">
        {{ 'app.title' | transloco }}
      </span>
      @if (version()) {
        <span
          class="rounded-full px-2 py-0.5 text-xs"
          style="border: 1px solid var(--p-surface-0); color: var(--p-surface-0);"
        >v{{ version() }}-beta</span>
      }
    </div>

    <div class="flex items-center gap-4">
      <app-alert-bell />
      <app-language-switcher severity="contrast" />
      @if (session.user(); as user) {
        <button
          type="button"
          class="lwl-micro flex items-center gap-1"
          style="color: var(--p-surface-200); background: none; border: none; cursor: pointer; font-family: inherit;"
          [title]="'header.changePassword' | transloco"
          (click)="changePasswordVisible.set(true)"
        >
          <i class="pi pi-key"></i>
          {{ user.username }}
        </button>
      }
      <p-button size="small" severity="secondary" [label]="'header.signOut' | transloco" (onClick)="signOut()" />
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <nav
      class="flex flex-col gap-1.5 p-3"
      style="width: var(--nav-width); background: var(--p-content-background); border-right: 1px solid var(--frame-border-color);"
    >
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="lwl-nav-item"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.labelKey | transloco }}</span>
        </a>
      }

      <button type="button" class="lwl-nav-item" (click)="aboutVisible.set(true)">
        <i class="pi pi-info-circle"></i>
        <span>{{ 'nav.about' | transloco }}</span>
      </button>
    </nav>

    <main class="flex-1 overflow-auto" style="background: var(--p-content-background);">
      <router-outlet />
    </main>
  </div>
</div>

<p-dialog [(visible)]="aboutVisible" [modal]="true" [header]="'about.heading' | transloco" [style]="{ width: '32rem' }">
  <app-about [showHeading]="false" />
</p-dialog>

<p-dialog [(visible)]="changePasswordVisible" [modal]="true" [header]="'changePassword.title' | transloco" [style]="{ width: '28rem' }">
  <app-change-password-form (saved)="changePasswordVisible.set(false)" (cancelled)="changePasswordVisible.set(false)" />
</p-dialog>
