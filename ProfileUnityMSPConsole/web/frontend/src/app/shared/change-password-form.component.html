<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3" style="min-width: 24rem;">
  @if (saveError()) {
    <p-message severity="error" styleClass="w-full">{{ saveError()! | transloco }}</p-message>
  }

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'changePassword.currentPassword' | transloco }}</span>
    <p-password formControlName="currentPassword" [feedback]="false" [toggleMask]="true" autocomplete="current-password" styleClass="w-full" inputStyleClass="w-full" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'changePassword.newPassword' | transloco }}</span>
    <p-password formControlName="newPassword" [feedback]="false" [toggleMask]="true" autocomplete="new-password" styleClass="w-full" inputStyleClass="w-full" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'changePassword.confirmPassword' | transloco }}</span>
    <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" autocomplete="new-password" styleClass="w-full" inputStyleClass="w-full" />
  </label>

  <div class="mt-2 flex justify-end gap-2">
    <p-button type="button" severity="secondary" [outlined]="true" [label]="'changePassword.cancel' | transloco" (onClick)="cancelled.emit()" />
    <p-button type="submit" [label]="'changePassword.save' | transloco" [loading]="saving()" [disabled]="form.invalid" />
  </div>
</form>
