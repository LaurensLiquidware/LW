<div class="login">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <div class="login-logo">
      <img src="assets/images/logo-primary-light.svg" alt="Liquidware" />
    </div>

    <p class="login-product">{{ 'app.title' | transloco }}</p>

    <h1 class="lwl-card-title text-center" style="font-size: var(--text-lg);">
      {{ 'login.heading' | transloco }}
    </h1>

    @if (expired()) {
      <p-message severity="warn" styleClass="w-full">{{ 'login.sessionExpired' | transloco }}</p-message>
    }
    @if (errorKey()) {
      <p-message severity="error" styleClass="w-full">{{ errorKey()! | transloco }}</p-message>
    }

    <label class="flex w-full flex-col gap-1">
      <span>{{ 'login.username' | transloco }}</span>
      <div class="login-field">
        <i class="pi pi-user lead"></i>
        <input formControlName="username" autocomplete="username" [placeholder]="'login.username' | transloco" />
      </div>
    </label>

    <label class="flex w-full flex-col gap-1">
      <span>{{ 'login.password' | transloco }}</span>
      <div class="login-field">
        <i class="pi pi-lock lead"></i>
        <input
          formControlName="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          autocomplete="current-password"
          [placeholder]="'login.password' | transloco"
        />
        <button
          type="button"
          class="trail"
          [attr.aria-label]="'login.togglePassword' | transloco"
          (click)="passwordVisible.set(!passwordVisible())"
        >
          <i [class]="passwordVisible() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </div>
    </label>

    <p-button
      type="submit"
      [label]="'login.submit' | transloco"
      [loading]="submitting()"
      [disabled]="form.invalid"
      styleClass="w-full"
    />

    <div class="login-actions">
      <app-language-switcher severity="contrast" />
    </div>
  </form>
</div>
