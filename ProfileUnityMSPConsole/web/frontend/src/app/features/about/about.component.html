<div class="mx-auto flex max-w-2xl flex-col gap-4 p-6">
  <h1 class="lwl-card-title" style="font-size: var(--text-xl);">
    {{ 'about.heading' | transloco }}
  </h1>

  <p-card>
    <div class="flex flex-col gap-3">
      <div>
        <span class="lwl-micro">{{ 'about.version' | transloco }}</span>
        <div class="lwl-metric-label">{{ version() ?? '—' }}</div>
      </div>

      <p class="lwl-body">{{ 'about.notice' | transloco }}</p>

      <ul class="flex flex-col gap-1">
        <li>
          <a href="/Spark_License.pdf" target="_blank" rel="noopener" style="color: var(--link-color);">
            {{ 'about.licenseLink' | transloco }}
          </a>
        </li>
        <li>
          <a href="/bom.cdx.json" target="_blank" rel="noopener" style="color: var(--link-color);">
            {{ 'about.sbomLink' | transloco }}
          </a>
          <p class="lwl-micro">{{ 'about.sbomDescription' | transloco }}</p>
        </li>
      </ul>
    </div>
  </p-card>
</div>
