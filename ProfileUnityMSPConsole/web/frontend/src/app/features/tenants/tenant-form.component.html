<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3" style="width: 26rem; max-width: 100%;">
  @if (saveError()) {
    <p-message severity="error" styleClass="w-full">{{ saveError()! | transloco }}</p-message>
  }

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'tenants.displayName' | transloco }}</span>
    <input pInputText formControlName="displayName" />
  </label>

  <div class="flex flex-wrap gap-3">
    <label class="flex flex-1 flex-col gap-1" style="min-width: 12rem;">
      <span class="lwl-micro">{{ 'tenants.hostname' | transloco }}</span>
      <input pInputText formControlName="hostname" />
    </label>
    <label class="flex flex-col gap-1" style="width: 8rem;">
      <span class="lwl-micro">{{ 'tenants.port' | transloco }}</span>
      <p-inputnumber formControlName="port" [useGrouping]="false" styleClass="w-full" inputStyleClass="w-full" />
    </label>
  </div>

  <label class="flex items-center gap-2">
    <p-checkbox formControlName="tlsSkipVerify" [binary]="true" inputId="tlsSkipVerify" />
    <span for="tlsSkipVerify">{{ 'tenants.tlsSkipVerify' | transloco }}</span>
  </label>
  @if (form.controls.tlsSkipVerify.value) {
    <p-message severity="warn" styleClass="w-full">{{ 'tenants.tlsSkipVerifyWarning' | transloco }}</p-message>
  }

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'tenants.username' | transloco }}</span>
    <input pInputText formControlName="username" autocomplete="off" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">
      {{ 'tenants.password' | transloco }}
      @if (isEdit && existingHasPassword) {
        <span class="lwl-muted">— {{ 'tenants.passwordUnchangedHint' | transloco }}</span>
      }
    </span>
    <p-password formControlName="password" [feedback]="false" [toggleMask]="true" autocomplete="new-password" styleClass="w-full" inputStyleClass="w-full" />
  </label>

  <label class="flex items-center gap-2">
    <p-checkbox formControlName="enabled" [binary]="true" inputId="enabled" />
    <span for="enabled">{{ 'tenants.enabled' | transloco }}</span>
  </label>

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'tenants.tags' | transloco }} — {{ 'tenants.tagsHint' | transloco }}</span>
    <input pInputText formControlName="tags" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="lwl-micro">{{ 'tenants.notes' | transloco }}</span>
    <textarea pInputText formControlName="notes" rows="2"></textarea>
  </label>

  <div class="flex flex-wrap items-center gap-3">
    <p-button
      type="button"
      severity="secondary"
      [outlined]="true"
      [label]="'tenants.testConnection' | transloco"
      [loading]="testing()"
      [disabled]="!form.controls.hostname.value"
      (onClick)="testConnection()"
    />
    @if (testResult(); as result) {
      <span
        class="lwl-micro"
        [style.color]="result.outcome.endsWith('_success') ? 'var(--good-color)' : 'var(--poor-color)'"
      >
        {{ result.message }}
      </span>
    }
  </div>

  <div class="mt-2 flex justify-end gap-2">
    <p-button type="button" severity="secondary" [outlined]="true" [label]="'tenants.cancel' | transloco" (onClick)="cancelled.emit()" />
    <p-button type="submit" [label]="'tenants.save' | transloco" [loading]="saving()" [disabled]="form.invalid" />
  </div>
</form>
